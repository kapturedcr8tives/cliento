apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crm-staging

resources:
- ../../base

patches:
- path: namespace-patch.yaml
  target:
    kind: Deployment
    name: crm-system
- path: namespace-patch.yaml
  target:
    kind: Service
    name: crm-service
- path: namespace-patch.yaml
  target:
    kind: Ingress
    name: crm-ingress
- path: namespace-patch.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: crm-hpa

images:
- name: ${DOCKER_REGISTRY}/crm-system
  newTag: staging

configMapGenerator:
- name: crm-config
  literals:
  - NODE_ENV=staging
  - LOG_LEVEL=debug

secretGenerator:
- name: crm-secrets
  envs:
  - .env.staging